name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Export Expo web
        run: npx expo export --platform web --output-dir dist

      - name: Add Search Console verification
        run: |
          python3 - << 'PY'
          import pathlib
          tag = '<meta name="google-site-verification" content="bcJCQu8evHX9op2zNnmIjL4jr4l1Q69mtyYv_5sTe7g"/>'
          files = list(pathlib.Path('dist').rglob('index.html'))
          if not files:
              raise SystemExit('no index.html to tag')
          for path in files:
              text = path.read_text()
              if 'google-site-verification' in text:
                  print('already tagged', path)
                  continue
              if '<head>' not in text:
                  raise SystemExit(f'no head tag in {path}')
              path.write_text(text.replace('<head>', '<head>' + tag, 1))
              print('tagged', path)
          PY

      - name: Require an index.html before deploy
        run: |
          find dist -name index.html -maxdepth 3
          if [ -f dist/index.html ]; then
            exit 0
          fi
          if [ -f dist/client/index.html ]; then
            node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('firebase.json','utf8')); j.hosting.public='dist/client'; fs.writeFileSync('firebase.json', JSON.stringify(j, null, 2) + '\n');"
            exit 0
          fi
          echo 'Export did not create index.html'
          exit 1

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: my-rental-fleet
